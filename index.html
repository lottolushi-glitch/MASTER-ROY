<style>
:root{--bg:#EEF0FF;--sky:#2BA8F5;--card:#fff;--ink:#23214A;--pri:#4B4DED;--priD:#3638B8;--ok:#2FBF8F;--okD:#1E9970;--no:#FF6B6B;--noD:#D44A4A;--sun:#FFC94D;--soft:#D9DCFF;--mute:#6B6A94;--okBg:#DFF6EE;--noBg:#FFE3E3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17163A;--card:#24225A;--ink:#F2F1FF;--soft:#3A3880;--mute:#A9A8D6;--okBg:#1B4A44;--noBg:#5A2A3C;--pri:#7476FF;--sky:#1A6FD6}}
:root[data-theme="dark"]{--sky:#1A6FD6;--bg:#17163A;--card:#24225A;--ink:#F2F1FF;--soft:#3A3880;--mute:#A9A8D6;--okBg:#1B4A44;--noBg:#5A2A3C;--pri:#7476FF}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 8%,rgba(255,201,77,.28),transparent 42%),radial-gradient(circle at 92% 92%,rgba(75,77,237,.22),transparent 45%),var(--bg);background-attachment:fixed;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:16px 18px 28px;display:flex;flex-direction:column;align-items:center}
button{font:inherit;color:inherit;cursor:pointer;border:0}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
#wrap{width:min(62vw,230px);transition:width .6s cubic-bezier(.5,0,.2,1);margin-top:14px}
#wrap.play{width:104px;margin-top:0}
#mr{width:100%;display:block;overflow:visible;transform-origin:50% 95%;filter:drop-shadow(0 8px 0 rgba(35,33,74,.12))}
#mr .body{fill:var(--mc,var(--sun));stroke:var(--mc,var(--sun));stroke-width:16;stroke-linejoin:round;transition:fill .25s,stroke .25s}
#mr .ink{fill:var(--ink)}

#mr .cheek{fill:#FF8FA3;opacity:.55}
#mr .e2{transform-box:fill-box;transform-origin:center}
#mr .hEyes,#mr .mHappy,#mr .mAngry,#mr .spark{display:none}
#mr.happy .eyes,#mr.angry .hEyes{display:none}
#mr.happy .hEyes,#mr.happy .mHappy,#mr.happy .spark,#mr.angry .mAngry{display:inline}
#mr{--ink:#1a1840}
#mr .out{fill:var(--ink);stroke:var(--ink);stroke-width:23;stroke-linejoin:round}
#mr .sc{fill:#fff;stroke:var(--ink);stroke-width:3}
#mr .brow{fill:var(--ink);transform-box:fill-box;transform-origin:center;transition:transform .25s}
#mr.angry .bl{transform:rotate(20deg) translateY(4px)}
#mr.angry .br{transform:rotate(-20deg) translateY(4px)}
#mr.happy .brow{transform:translateY(-6px)}
.over{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(8,40,110,.62);backdrop-filter:blur(3px)}
.pop{background:var(--card);color:var(--ink);border-radius:32px;padding:30px 22px;text-align:center;width:min(100%,440px);box-shadow:0 8px 0 var(--soft);animation:boom .5s cubic-bezier(.3,1.6,.5,1)}
.pop h1{font-size:clamp(2.3rem,11vw,3.3rem);margin:6px 0 8px}
@keyframes boom{from{scale:.5;opacity:0}to{scale:1;opacity:1}}
.ld{max-width:320px;margin:22px auto 14px}
.ld i{animation:fill 6s linear forwards;transition:none}
@keyframes fill{to{width:100%}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.lv{aspect-ratio:1;border-radius:22px;background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;padding:6px;line-height:1.05;transition:transform .08s,box-shadow .08s}
.lv b{font-size:1.9rem;color:var(--pri)}
.lv small{font-size:.78rem;color:var(--mute);font-weight:700}
.lv.on{border:3px solid var(--pri)}
.lv.done b{color:var(--ok)}
.lv:disabled{opacity:.6;cursor:not-allowed}
.lv:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--soft)}
.back{background:none;color:var(--mute);font-weight:800;margin-top:16px;font-size:1.05rem;padding:6px 12px}
.lang{align-self:flex-end;display:flex;gap:4px;background:var(--card);border-radius:99px;padding:3px;box-shadow:0 3px 0 var(--soft)}
.lang button{background:none;color:var(--mute);font-weight:800;padding:2px 12px;border-radius:99px}
.lang button.on{background:var(--pri);color:#fff}
.pathbox{max-height:62vh;overflow-y:auto;padding:6px 0 18px;-webkit-overflow-scrolling:touch}
.path{display:flex;flex-direction:column;align-items:center;gap:14px}
.row{display:flex;flex-direction:column;align-items:center;gap:2px}
.nd{width:88px;height:88px;border-radius:50%;background:var(--pri);color:#fff;font-size:2rem;font-weight:800;box-shadow:0 7px 0 var(--priD);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.nd.done{background:var(--ok);box-shadow:0 7px 0 var(--okD)}
.nd:not(:disabled):active{transform:translateY(5px);box-shadow:0 2px 0 var(--priD)}
.nd:disabled{opacity:.4;cursor:not-allowed}
.nd:disabled span{opacity:.6}
.row small{font-size:.9rem;min-height:1.2em}
.top2{align-self:flex-end;display:flex;gap:8px;align-items:center}
#snd{background:var(--card);border-radius:99px;width:36px;height:36px;box-shadow:0 3px 0 var(--soft);font-size:1.05rem}
#mr.happy .mSmile,#mr.angry .mSmile{display:none}
#mr.happy .mHappy{fill:var(--ink);stroke:var(--ink)}
#mr.angry .body{fill:var(--no);stroke:var(--no)}
#mr.angry .cheek{opacity:.2}
#mr .spark text{font-size:24px;fill:var(--pri);animation:pop .7s ease-out both}
#mr .spark text:nth-child(2){animation-delay:.12s;fill:var(--ok)}
#mr .spark text:nth-child(3){animation-delay:.24s;fill:var(--no)}
#mr.idle{animation:nod 9s ease-in-out infinite,shake 9s ease-in-out infinite}
#mr.idle .e2{animation:wink 9s ease-in-out infinite}
#mr.happy{animation:hop .7s ease-out}
#mr.angry{animation:grr .55s ease-in-out}
@keyframes wink{0%,4%{scale:1}8%{scale:1 .1}14%{scale:1}18%{scale:1 .1}24%,100%{scale:1}}
@keyframes shake{0%,33%{rotate:0deg}38%{rotate:-10deg}43%{rotate:10deg}48%{rotate:-10deg}53%{rotate:10deg}58%{rotate:-5deg}63%,100%{rotate:0deg}}
@keyframes nod{0%,66%{translate:0 0}70%{translate:0 12px}74%{translate:0 0}78%{translate:0 12px}82%{translate:0 0}86%{translate:0 12px}90%,100%{translate:0 0}}
@keyframes hop{0%{translate:0 0}30%{translate:0 -22px;scale:1.06}60%{translate:0 0;scale:.96}100%{translate:0 0;scale:1}}
@keyframes grr{0%,100%{rotate:0deg}15%{rotate:-8deg}35%{rotate:8deg}55%{rotate:-6deg}75%{rotate:6deg}}
@keyframes pop{0%{opacity:0;translate:0 10px}40%{opacity:1}100%{opacity:1;translate:0 -4px}}
.screen{width:100%;margin-top:18px;animation:in .4s ease-out}
@keyframes in{from{opacity:0}to{opacity:1}}
[hidden]{display:none!important}
#home{text-align:center}
.tag{display:inline-block;background:var(--soft);color:var(--pri);font-weight:800;padding:2px 16px;border-radius:99px;font-size:1.05rem}
h1{font-size:clamp(1.9rem,8vw,2.5rem);line-height:1.08;margin:12px 0 10px;font-weight:800}
.sub{color:var(--mute);font-size:1.15rem;line-height:1.3;max-width:30ch;margin:0 auto 26px}
.big{background:var(--pri);color:#fff;font-weight:800;font-size:1.4rem;padding:14px 46px;border-radius:20px;box-shadow:0 6px 0 var(--priD);transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--priD)}
.big.alt{color:#fff;background:var(--ok);box-shadow:0 6px 0 var(--okD)}
.big.alt:active{box-shadow:0 1px 0 var(--okD)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:14px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .4s}
.pill{color:var(--ink);font-weight:800;background:var(--card);padding:2px 14px;border-radius:99px;box-shadow:0 3px 0 var(--soft);white-space:nowrap}
.count{color:var(--mute);font-weight:700;margin-bottom:6px}
.card{color:var(--ink);background:var(--card);border-radius:26px;padding:20px 18px;box-shadow:0 6px 0 var(--soft)}
.q{font-size:1.45rem;font-weight:800;line-height:1.2;margin-bottom:16px}
.ans{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:10px 14px;background:var(--card);border:3px solid var(--soft);border-radius:18px;font-weight:700;font-size:1.08rem;line-height:1.2;box-shadow:0 4px 0 var(--soft);transition:transform .08s,box-shadow .08s,background .2s}
.opt b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:1rem}
.opt:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--soft)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okBg);border-color:var(--ok);box-shadow:0 4px 0 var(--okD)}
.opt.ok b{background:var(--ok);color:#fff}
.opt.no{background:var(--noBg);border-color:var(--no);box-shadow:0 4px 0 var(--noD)}
.opt.no b{background:var(--no);color:#fff}
.opt.dim{opacity:.55}
#fb{margin-top:16px;border-radius:20px;padding:14px 16px}
#fb.ok{background:var(--okBg)}#fb.no{background:var(--noBg)}
#fb h2{font-size:1.35rem;font-weight:800}
#fb.ok h2{color:var(--okD)}#fb.no h2{color:var(--noD)}
#fb p{font-size:1.05rem;line-height:1.3;margin:4px 0 12px}
#fb .big{width:100%;padding:11px;font-size:1.2rem}
#end{text-align:center}
.stars{font-size:3rem;letter-spacing:6px;margin:6px 0 2px}
.stars s{text-decoration:none;opacity:.22;filter:grayscale(1)}
.score{font-size:1.3rem;font-weight:700;color:var(--mute);margin-bottom:22px}
.next{margin-top:18px;color:var(--mute);font-weight:700}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
